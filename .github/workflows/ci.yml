name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Deps
        run: python -m pip install pytest "playwright==1.63.*" numpy imageio-ffmpeg rapidocr onnxruntime opencv-python-headless
      - name: Chromium
        run: python -m playwright install --with-deps chromium
      - name: Tests
        run: python -m pytest plugins/demo-studio/scripts/tests -q
