# demo.yaml - properties of this demo. Simple YAML: "key: value", lists as [a, b], # comments.
# demo-strategist fills it at G1; privacy-guard owns `privacy.*`; the director records your decisions. Other agents only read it.

platform: null        # web | desktop | android | ios
length_s: null        # target seconds (final video within +-10%)
language: null        # on-screen / source language, e.g. en. null = voice.language
formats: ["16:9"]     # "16:9" | "9:16" | "1:1"

voice:
  engine: edge        # edge (free) | kokoro (offline) | elevenlabs (paid, key in env) | recorded
  name: null          # voice name; null = engine default
  rate: "+0%"         # -30%..+30%; prefer cutting words over speeding up
  language: en        # narration language
  lexicon: {}         # written term -> spoken form, TTS input only

captions:
  burn_in: false      # true = burned into the picture

music:
  file: null          # path or null (voice only)
  gain_db: -20

privacy:
  data_mode: seeded   # seeded = demo account / invented data (default) | real (only if the user chose it at G1)
  real_confirmation: null   # director: the user's words + date when data_mode is real
  mask: []            # CSS selectors hidden during web recording, e.g. [".user-email", "[data-secret]"]
  patterns: []        # regexes verify.py must not find on screen, e.g. ["sk-[A-Za-z0-9]{8,}"]
  seed_values: []     # known real literals to look for (real mode only); never commit real values

tools:
  ocr: null           # qa-ocr (RapidOCR, recommended) | qa-ocr-tesseract | none (leak check by eye only)
