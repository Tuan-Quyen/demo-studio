<!doctype html>
<html><head><meta charset="utf-8"><title>Unmaskable (fixture)</title>
<style>
  body { margin: 0; font: 22px Arial, sans-serif; background: #fff; color: #111; }
  #pseudo::before { content: "bob@corp.example"; }
  iframe { width: 300px; height: 80px; border: 1px solid #888; }
  canvas { width: 200px; height: 60px; }
</style></head>
<body>
<p id="pseudo"></p>
<iframe srcdoc="<p>framed text</p>"></iframe>
<canvas id="cv"></canvas>
<div id="host"></div>
<script>
const sr = document.getElementById('host').attachShadow({mode: 'closed'});
sr.innerHTML = '<p>carol@shadow.example</p>';
</script>
</body></html>
